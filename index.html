<!doctype html>
<html lang="en" class="intro-lock">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thuytiengem · Portfolio</title>
<meta name="description" content="Portfolio of Tran Thi Thuy Tien (Thuytiengem) — game art, 3D Blender and personal artworks.">
<meta name="theme-color" content="#1c0f30">
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/Qualy-Bold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="assets/fonts/Montserrat-latin-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/intro.css">
<link rel="stylesheet" href="assets/css/sections.css">
<link rel="stylesheet" href="assets/css/portfolio-menu.css">
</head>
<body>
<canvas class="rain" id="rain" aria-hidden="true"></canvas>

<!-- ============ Topbar ============ -->
<header class="topbar" id="topbar">
  <a class="brand" href="#home" id="brand"></a>
  <nav class="nav" id="nav">
    <a href="#home" data-i18n="nav_home"></a>
    <a href="#featured" data-i18n="nav_portfolio"></a>
    <a href="#about" data-i18n="nav_about"></a>
    <a href="#contact" data-i18n="nav_contact"></a>
  </nav>
  <div class="lang" id="lang">
    <button class="lang-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span class="lang-label"></span>
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7" stroke="#fff" stroke-width="3" fill="none"/></svg>
    </button>
    <ul class="lang-menu" role="listbox"></ul>
  </div>
  <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false"><span></span></button>
</header>

<main>
  <!-- ============ Hero / intro (see assets/js/intro/) ============ -->
  <section class="hero" id="home">
    <div class="stage" id="heroStage" aria-hidden="true"></div>
    <div class="hero-ring" id="heroRing"></div>
    <canvas class="hero-fx" id="heroFx" aria-hidden="true"></canvas>
    <div class="hero-titles">
      <div class="hero-brand" id="heroBrand"></div>
      <h1 class="glitch" id="heroTitle"></h1>
    </div>
    <div class="hero-quote" id="heroQuote"><span id="heroQuoteText"></span></div>
    <div class="hero-flash" id="heroFlash"></div>
  </section>

  <!-- ============ Featured projects ============ -->
  <section id="featured">
    <div class="band"><h2 data-i18n="featured_title"></h2></div>
    <div class="container featured-list" id="featuredList"></div>
    <div class="container other reveal">
      <h3 data-i18n="other_title"></h3>
      <p data-i18n="other_text"></p>
      <a class="btn-explore" id="otherExplore" href="#" data-i18n="explore"></a>
    </div>
  </section>

  <!-- ============ 3D Blender ============ -->
  <section id="blender">
    <div class="band"><h2 data-i18n="blender_title"></h2></div>
    <div class="container blender" id="blenderList"></div>
  </section>

  <!-- ============ 2D Artwork: 01 Personal artworks (carousel) · 02 Other 2D projects (3 cards) ============ -->
  <section id="artworks">
    <div class="band"><h2 data-i18n="artworks_title"></h2></div>
    <div class="artworks" id="artworksPersonal">
      <div class="artworks-bg" id="artworksBg"></div>
      <div class="container sub-head"><span class="sub-num">01</span><h3 id="artworksPersonalTitle"></h3><i></i></div>
      <div class="carousel" id="carousel" tabindex="0" aria-roledescription="carousel">
        <button class="carousel-arrow prev" type="button" aria-label="Previous">
          <svg width="30" height="34" viewBox="0 0 30 34"><path d="M16 3 4 17l12 14M26 3 14 17l12 14" stroke="#f2d9ff" stroke-width="4" fill="none"/></svg>
        </button>
        <button class="carousel-arrow next" type="button" aria-label="Next">
          <svg width="30" height="34" viewBox="0 0 30 34"><path d="M14 3l12 14-12 14M4 3l12 14L4 31" stroke="#f2d9ff" stroke-width="4" fill="none"/></svg>
        </button>
      </div>
      <div class="artworks-caption" id="artworksCaption" aria-live="polite"><h3></h3><p></p></div>
      <div class="carousel-dots" id="carouselDots"></div>
      <div class="cta"><a class="btn-explore" id="artworksExplore" href="art2d.html" data-i18n="explore"></a></div>
    </div>
    <div class="container other-art reveal" id="artworksOther">
      <div class="sub-head"><span class="sub-num">02</span><h3 data-i18n="artworks_other"></h3><i></i></div>
      <div class="art-cards" id="otherArtGrid"></div>
      <div class="cta"><a class="btn-explore" id="otherArtExplore" href="art2d.html" data-i18n="explore"></a></div>
    </div>
  </section>

  <!-- ============ About me ============ -->
  <section id="about">
    <div class="band"><h2 data-i18n="about_title"></h2></div>
    <div class="about">
      <div class="container">
        <div class="about-top reveal">
          <!-- same cyan HUD corner frame as the videos (.hud-frame, sections.css) -->
          <div class="hud-frame about-photo-frame">
            <div class="about-photo" id="aboutPhoto"></div>
            <i class="c1" aria-hidden="true"></i><i class="c2" aria-hidden="true"></i><i class="c3" aria-hidden="true"></i><i class="c4" aria-hidden="true"></i>
          </div>
          <div class="about-profile">
            <h3 id="aboutName"></h3>
            <div class="panel">
              <h4 id="aboutRole"></h4>
              <ul class="list" id="aboutSummary"></ul>
            </div>
          </div>
        </div>
        <h3 class="experience-title" data-i18n="experience_title"></h3>
        <div class="timeline reveal" id="timeline"></div>
        <div class="cta"><a class="btn-explore" id="aboutExplore" href="#" data-i18n="read_cv"></a></div>
      </div>
    </div>
  </section>
</main>

<!-- ============ Contact ============ -->
<footer class="contact" id="contact">
  <div class="container">
    <div class="contact-grid">
      <div>
        <h2 data-i18n="talk_title"></h2>
        <p class="contact-text" data-i18n="talk_text"></p>
        <div class="contact-info">
          <div id="contactEmail"><span data-i18n="my_email"></span> <a></a></div>
          <div id="contactPhone"><span data-i18n="my_phone"></span> <a></a></div>
        </div>
        <div class="socials" id="socials"></div>
      </div>
      <form class="contact-form" id="contactForm" novalidate>
        <label for="cfName" data-i18n="form_name"></label>
        <input id="cfName" name="name" type="text" required autocomplete="name">
        <label for="cfEmail" data-i18n="form_email"></label>
        <input id="cfEmail" name="email" type="email" required autocomplete="email">
        <label for="cfMessage" data-i18n="form_message"></label>
        <textarea id="cfMessage" name="message"></textarea>
        <div class="cta"><button class="btn-explore" type="submit" data-i18n="form_send"></button></div>
      </form>
    </div>
    <p class="copyright" data-i18n="copyright"></p>
  </div>
</footer>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
