<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro demo 2</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/intro.css">
<link rel="stylesheet" href="kit.css">
</head>
<body>
<script type="module">
import * as K from "./kit.js";
const refs = K.skeleton({ index: 2, name: "Power Surge", note: "Mạch điện sáng lên trước, kính hiện phía sau, quá tải (glitch, sáng dần) rồi trắng xoá và nổ 3D; vài mảnh nhỏ dừng lại; khi idle mọi mảnh vỡ thỉnh thoảng bị nhiễu (error)." });
const sprites = await K.preload();
const P = K.createParticles(refs.fx, sprites);
import play from "./demo-2.js";
K.run(refs, alive => { P.clear(); return play({ K, refs, P, alive }); });
</script>
</body>
</html>
