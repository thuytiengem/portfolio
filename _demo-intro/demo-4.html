<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro demo 4</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/intro.css">
<link rel="stylesheet" href="kit.css">
</head>
<body>
<script type="module">
import * as K from "./kit.js";
const refs = K.skeleton({ index: 4, name: "Assemble", note: "Ngược lại: các mảnh bay từ ngoài vào ghép thành hình vỡ, năng lượng hút vào tâm, mạch điện sáng phía sau." });
const sprites = await K.preload();
const P = K.createParticles(refs.fx, sprites);
import play from "./demo-4.js";
K.run(refs, alive => { P.clear(); return play({ K, refs, P, alive }); });
</script>
</body>
