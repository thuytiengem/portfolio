<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro demo 1</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/intro.css">
<link rel="stylesheet" href="kit.css">
</head>
<body>
<script type="module">
import * as K from "./kit.js";
const refs = K.skeleton({ index: 1, name: "Impact Shatter", note: "Kính bật sáng, rung mạnh dần, nứt rồi bung ra (có nảy lại), mảnh vụn rơi theo trọng lực." });
const sprites = await K.preload();
const P = K.createParticles(refs.fx, sprites);
import play from "./demo-1.js";
K.run(refs, alive => { P.clear(); return play({ K, refs, P, alive }); });
</script>
</body>
</html>
