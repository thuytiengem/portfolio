<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro demo 3</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/intro.css">
<link rel="stylesheet" href="kit.css">
</head>
<body>
<script type="module">
import * as K from "./kit.js";
const refs = K.skeleton({ index: 3, name: "Slow-mo Freeze", note: "Một cú va chạm ở tâm, vỡ nhanh rồi chậm dần và đóng băng lơ lửng; mảnh vụn trôi, di chuột có parallax." });
const sprites = await K.preload();
const P = K.createParticles(refs.fx, sprites);
import play from "./demo-3.js";
K.run(refs, alive => { P.clear(); return play({ K, refs, P, alive }); });
</script>
</body>
</html>
