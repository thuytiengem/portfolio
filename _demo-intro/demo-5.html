<title>Intro demo 5</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/intro.css">
<link rel="stylesheet" href="kit.css">
</head>
<body>
<script type="module">
import * as K from "./kit.js";
const refs = K.skeleton({ index: 5, name: "Glitch Cut", note: "Kiểu tín hiệu số: tách màu RGB, scanline, kính bị xé lát; cú cắt cứng — mảnh giật qua lại rồi khớp." });
const sprites = await K.preload();
const P = K.createParticles(refs.fx, sprites);
import play from "./demo-5.js";
K.run(refs, alive => { P.clear(); return play({ K, refs, P, alive }); });
</script>
